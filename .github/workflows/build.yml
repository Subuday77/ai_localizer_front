name: Angular build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/vps-api-public-demo-20261114]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify no API credentials in frontend
        run: |
          if grep -R -E 'loc_sk_|OPENAI_API_KEY|AI_LOCALIZER_API_KEY' src/; then
            echo 'Forbidden credential reference in frontend source'
            exit 1
          fi
